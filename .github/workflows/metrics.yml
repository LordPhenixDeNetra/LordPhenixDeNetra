name: Metrics

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/metrics.yml]

# Les plugins "achievements" (API Projects classic supprimée) et "habits"
# (commits sans auteur) plantent côté lowlighter/metrics : ils sont retirés.
jobs:
  metrics:
    permissions:
      contents: write
    runs-on: ubuntu-latest

    steps:
      - name: Overview
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: assets/metrics-overview.svg
          committer_message: "chore: update metrics"
          template: classic
          config_timezone: Africa/Dakar
          base: header, activity, community, repositories
          base_indepth: yes
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

      - name: Languages
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: assets/metrics-languages.svg
          committer_message: "chore: update metrics"
          template: classic
          config_timezone: Africa/Dakar
          base: ""
          plugin_languages: yes
          plugin_languages_indepth: yes
          plugin_languages_details: bytes-size, percentage
          plugin_languages_sections: most-used, recently-used
          plugin_languages_ignored: html, css, tex, jupyter notebook, shell, powershell, batchfile, makefile, dockerfile
          plugin_languages_limit: 8
          plugin_lines: yes
